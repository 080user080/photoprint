[general]
default_mode = auto
window_width = 1920
window_height = 1000
queue_width = 200
minimize_to_tray = false

[processing]
autofix_enabled = true
auto_apply_autofix = true
hdr_in_autofix = true
auto_perspective = true
partial_perspective = false
shadow_highlight_strength = 0.2
sharpen_strength = 1.0
hdr_strength = 0.15
autosharp_threshold = 10.0
autosharp_max_strength = 0.8
classify_bw_std_thresh = 100.0
classify_edge_ratio_min = 0.15
classify_line_count_min = 15
auto_percentile_low = 2.0
auto_percentile_high = 98.0
bw_binary = false
autofix_contrast = 0.0
contrast_mode = percentile
shadow_remove_enabled = true
shadow_detect_threshold = 80.0
shadow_detect_ratio = 0.3
shadow_coarse_blend_color = 0.2
pipeline_preset = custom
pipeline_steps_enabled = shadow_remove,brightness,contrast,hdr,sharpen,grayscale,white_background

[output]
output_color_mode = color
jpg_quality = 95
save_folder = 

[printer]
printer_name = priPrinter

