[general]
default_mode = auto
window_width = 1920
window_height = 1009
queue_width = 150
minimize_to_tray = false

[processing]
autofix_enabled = true
auto_apply_autofix = true
after_crop_action = autofix
hdr_in_autofix = false
auto_brightness_enabled = true
auto_perspective = false
partial_perspective = false
shadow_highlight_strength = 0.1
sharpen_strength = 0.65
hdr_strength = 0.0
autosharp_threshold = 1.0
autosharp_max_strength = 1.0
classify_bw_std_thresh = 100.0
classify_edge_ratio_min = 0.12
classify_line_count_min = 11
auto_percentile_low = 2.0
auto_percentile_high = 98.0
bw_binary = false
autofix_contrast = 0.15
contrast_mode = linear
shadow_remove_enabled = true
shadow_detect_threshold = 200.0
shadow_detect_ratio = 0.8
shadow_coarse_blend_color = 0.0
shadow_bgr_mode = false
shadow_uniformity_low = 0.3
shadow_uniformity_high = 0.5
shadow_uniformity_photo_high = 0.6
shadow_remove_mode = auto
shadow_uniform_std_threshold = 20.0
shadow_uniform_block_size = 48
worker_threads = 15
pipeline_preset = custom
pipeline_steps_enabled = perspective,shadow_remove,color_cast,brightness,contrast,hdr,sharpen,grayscale,white_background

[output]
output_color_mode = auto
jpg_quality = 95
save_folder = 

[printer]
printer_name = priPrinter

[appearance]
background_color = #6a6a6a
preview_bg_color = #6a6a6a
preview_text_color = #00557f
queue_bg_color = #5e5e5e
queue_text_color = #7a7a7a
auto_contrast_text = true

[tests]
test_images_enabled = true
test_images_folder = 

