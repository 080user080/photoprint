[general]
default_mode = auto
window_width = 1920
window_height = 1000
queue_width = 200
minimize_to_tray = false

[processing]
autofix_enabled = true
auto_apply_autofix = true
hdr_in_autofix = true
auto_perspective = false
partial_perspective = false
shadow_highlight_strength = 0.9
sharpen_strength = 0.35
hdr_strength = 1.0
autosharp_threshold = 10.0
autosharp_max_strength = 0.8
classify_bw_std_thresh = 100.0
classify_edge_ratio_min = 0.1
classify_line_count_min = 15
auto_percentile_low = 4.0
auto_percentile_high = 88.0
bw_binary = false
autofix_contrast = 0.0
contrast_mode = s_curve
full_auto_mode = false
full_auto_min_gradient_strength = 0.3

[output]
output_color_mode = color
jpg_quality = 95
save_folder = 

[printer]
printer_name = priPrinter

