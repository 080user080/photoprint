[general]
default_mode = auto
window_width = 1100
window_height = 680
queue_width = 200
minimize_to_tray = false

[processing]
autofix_enabled = true
auto_apply_autofix = true
hdr_in_autofix = true
auto_perspective = false
partial_perspective = false
shadow_highlight_strength = 0.0
sharpen_strength = 1.0
hdr_strength = 0.0
autosharp_threshold = 1.0
autosharp_max_strength = 1.0
classify_bw_std_thresh = 100.0
classify_edge_ratio_min = 0.12
classify_line_count_min = 22
auto_percentile_low = 0.0
auto_percentile_high = 100.0
bw_binary = false
autofix_contrast = 0.05
contrast_mode = s_curve
shadow_remove_enabled = true
shadow_detect_threshold = 200.0
shadow_detect_ratio = 0.8
shadow_coarse_blend_color = 1.0
shadow_bgr_mode = true
worker_threads = 15
pipeline_preset = custom
pipeline_steps_enabled = shadow_remove,perspective,brightness,contrast,hdr,sharpen,grayscale,white_background

[output]
output_color_mode = auto
jpg_quality = 95
save_folder = 

[printer]
printer_name = priPrinter

